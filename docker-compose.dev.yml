services:
  db:
    ports:
      - "${POSTGRES_PORT:-5436}:5432"

  api:
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      mailhog:
        condition: service_started
  
  worker:
    volumes:
      - ./api:/app
    environment:
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_FROM_EMAIL: noreply@eventhub.local
      SMTP_USE_TLS: "false"
    depends_on:
      mailhog:
        condition: service_started

  web:
    build:
      context: ./web
      target: development
    container_name: event_hub_web
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    environment:
      NUXT_PUBLIC_API_BASE: http://localhost:8000
      HOST: 0.0.0.0
      PORT: 3000
    depends_on:
      - api

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: event_hub_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@local.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy
  
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: event_hub_mailhog
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI

volumes:
  pgadmin_data:
  web_node_modules: