name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

env:
  SECRET_KEY: test-secret-key-for-tests-only
  POSTGRES_USER: auth_user
  POSTGRES_PASSWORD: auth_password
  POSTGRES_HOST: localhost
  POSTGRES_PORT: 5432
  POSTGRES_DB: event_hub_test

jobs:
  # ── Job 1: pytest ──────────────────────────────────────────
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: auth_user
          POSTGRES_PASSWORD: auth_password
          POSTGRES_DB: event_hub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    defaults:
      run:
        working-directory: api

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      
      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: api/pyproject.toml

      - name: Install Dependencies
        run: python -m pip install ".[test]"
      
      - name: Create test env file
        run: cp tests/.env.test.example tests/.env.test

      - name: Run tests
        run: pytest -v

  # ── Job 2: Alembic migrations ─────────────────────────────
  migration: 
    runs-on: ubuntu-latest
    
    services: 
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: auth_user
          POSTGRES_PASSWORD: auth_password
          POSTGRES_DB: event_hub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    defaults:
      run:
        working-directory: api
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        
      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: api/pyproject.toml
      
      - name: Install Dependencies
        run: python -m pip install ".[test]"

      - name: Apply migrations
        run: alembic upgrade head

  # ── Job 3: Ruff lint & format ─────────────────────────────
  lint:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: api
  
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      
      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: api/pyproject.toml
      
      - name: Install Dependencies
        run: python -m pip install ".[dev]"

      - name: Ruff lint
        run: ruff check .

      # - name: Ruff format
      #   run: ruff format --check .

  # ── Job 4: Docker build ────────────────────────────────────
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Build Docker images
        run: docker compose build api worker
  
  #  ── Job 5: Changelog & Release ──────────────────────────
  changelog:
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: taiki-e/install-action@git-cliff

      - name: Generate release notes
        run: git cliff --latest --strip header --github-repo "${{ github.repository }}" -o RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate changelog
        run: git cliff --github-repo "${{ github.repository }}" -o CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit changelog
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: update CHANGELOG for ${{ github.ref_name }}"
          branch: main