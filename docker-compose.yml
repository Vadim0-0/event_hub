services:

  db: 
    image: postgres:16-alpine
    container_name: event_hub_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-auth_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-auth_password}
      POSTGRES_DB: ${POSTGRES_DB:-auth_db}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-auth_user} -d ${POSTGRES_DB:-auth_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - default
      - dokploy-network

  redis:
    image: redis:8-alpine
    container_name: event_hub_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - default
      - dokploy-network
  
  api:
    build: ./api
    container_name: event_hub_api
    restart: unless-stopped
    environment:
      # Postgres
      POSTGRES_USER: ${POSTGRES_USER:-auth_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-auth_password}
      POSTGRES_DB: ${POSTGRES_DB:-auth_db}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379

      # ARQ
      ARQ_REDIS_DB: 1

      # JWT
      SECRET_KEY: ${SECRET_KEY}

      # Web UI
      WEB_APP_BASE_URL: ${WEB_APP_BASE_URL:-}

      # CORS
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:3000}

      # AI
      AI_ENABLED: ${AI_ENABLED:-true}
      AI_BASE_URL: http://ollama:11434
      AI_MODEL: ${AI_MODEL:-qwen2.5:3b}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-120}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
    expose:
      - "8000"
    networks:
      - default
      - dokploy-network

  worker:
    build: ./api
    container_name: event_hub_worker
    restart: unless-stopped
    environment:
      # Postgres
      POSTGRES_USER: ${POSTGRES_USER:-auth_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-auth_password}
      POSTGRES_DB: ${POSTGRES_DB:-auth_db}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379

      # ARQ
      ARQ_REDIS_DB: 1

      # SMTP
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL}
      SMTP_USE_TLS: ${SMTP_USE_TLS}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}

      # JWT
      SECRET_KEY: ${SECRET_KEY}

      # Web UI
      WEB_APP_BASE_URL: ${WEB_APP_BASE_URL:-}
    depends_on:
      redis:
        condition: service_healthy
    command: ["arq", "app.worker.settings.WorkerSettings"]
    networks:
      - default
      - dokploy-network

  web:
    build:
      context: ./web
      target: production
      args:
        NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE} 
    container_name: event_hub_web
    restart: unless-stopped
    environment:
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE}
      NUXT_PUBLIC_GEOAPIFY_API_KEY: ${NUXT_PUBLIC_GEOAPIFY_API_KEY}
      HOST: 0.0.0.0
      PORT: 3000
    expose:
      - "3000"
    depends_on:
      - api
    networks:
      - default
      - dokploy-network

  nginx:
    image: nginx:1.31-alpine
    container_name: event_hub_nginx
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web
    networks:
      - default
      - dokploy-network

  ollama:
    image: ollama/ollama:latest
    container_name: event_hub_ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    expose:
      - "11434"
    networks:
      - default
      - dokploy-network

volumes:
  postgres_data:
  ollama_data:

networks:
  dokploy-network:
    external: true
