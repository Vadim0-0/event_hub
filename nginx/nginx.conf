server {
  listen 80;
  server_name event-hub.codewithvadim.dev localhost;

  # Docker embedded DNS — resolve api/web at request time, not at startup
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  client_max_body_size 50M;

  location /api/ {
    rewrite ^/api/(.*)$ /$1 break;
    set $api_upstream http://api:8000;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 86400;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    set $web_upstream http://web:3000;
    proxy_pass $web_upstream;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  location = /health {
    set $api_upstream http://api:8000/health;
    proxy_pass $api_upstream;
    access_log off;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
